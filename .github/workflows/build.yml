name: Build DEB

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_NAME: BorderBeamDemo
  TWEAK_NAME: BorderBeamTweak
  VERSION: 1.1.0
  PKG_AUTHOR: "G-Using <G-Using@users.noreply.github.com>"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project BorderBeamDemo.xcodeproj \
            -scheme BorderBeamDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-app.log

      - name: Build tweak dylib
        run: |
          set -o pipefail
          xcodebuild \
            -project BorderBeamDemo.xcodeproj \
            -scheme BorderBeamTweak \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-tweak.log

      - name: Verify app bundle
        run: |
          APP=build/Build/Products/Release-iphoneos/${APP_NAME}.app
          test -d "$APP" || { echo "::error::app bundle missing"; tail -80 build-app.log; exit 1; }
          test -x "$APP/${APP_NAME}" || { echo "::error::executable missing"; ls -la "$APP"; exit 1; }
          ls -la "$APP"
          lipo -info "$APP/${APP_NAME}"

      - name: Verify tweak dylib
        run: |
          DYLIB=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.dylib" | head -1)
          test -n "$DYLIB" || { echo "::error::no dylib produced"; tail -120 build-tweak.log; exit 1; }
          echo "dylib: $DYLIB"
          lipo -info "$DYLIB"
          file "$DYLIB"
          echo "--- entry symbol ---"
          nm -gU "$DYLIB" | grep -i borderBeam_init || { echo "::error::entry symbol missing"; exit 1; }
          echo "--- sections ---"
          otool -l "$DYLIB" | /usr/bin/grep -E "^  sectname" | sort -u
          echo "--- borderbeam symbols ---"
          nm -gU "$DYLIB" | grep -iE "borderBeam|BorderBeamLoader" || true
          echo "--- ctor symbols (incl. local) ---"
          nm "$DYLIB" 2>/dev/null | grep -iE "ctor|mod_init" || true
          # A loaded dylib that never runs its entry point is indistinguishable
          # from "the tweak does nothing", so require at least one load hook.
          if otool -l "$DYLIB" | grep -q "__mod_init_func"; then
            echo "load hook: C constructor present"
          elif nm -gU "$DYLIB" | grep -q "_OBJC_CLASS_\$_BorderBeamLoader"; then
            echo "load hook: ObjC +load class present"
          else
            echo "::error::neither constructor nor +load class found - dylib would load and do nothing"
            exit 1
          fi
          echo "--- renderer present ---"
          nm -gU "$DYLIB" | grep -ic "BeamSweepView" || true
          echo "--- linked libraries (must be system-only, no Metal) ---"
          otool -L "$DYLIB"
          if otool -L "$DYLIB" | grep -Eiq "Metal|MetalKit"; then
            echo "::error::tweak still links Metal; it must not"
            exit 1
          fi
          echo "$DYLIB" > /tmp/dylib_path

      - name: Ensure a Metal shader resource ships in the app
        run: |
          APP=build/Build/Products/Release-iphoneos/${APP_NAME}.app
          if [ ! -f "$APP/default.metallib" ]; then
            echo "::warning::default.metallib missing - falling back to runtime compilation"
            cp Sources/BorderBeam/Shaders/BorderBeam.metal "$APP/"
          fi
          ls -la "$APP" | grep -Ei "metallib|\.metal" || true

      - name: Install ldid
        run: |
          mkdir -p tools/bin
          if [ "$(uname -m)" = "arm64" ]; then A=ldid_macosx_arm64; else A=ldid_macosx_x86_64; fi
          curl -fsSL --retry 3 --retry-delay 3 \
            "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/$A" \
            -o tools/bin/ldid
          chmod +x tools/bin/ldid

      - name: Stage app payload and sign
        run: |
          APP=build/Build/Products/Release-iphoneos/${APP_NAME}.app
          rm -rf stage-app
          mkdir -p stage-app/var/jb/Applications
          cp -R "$APP" stage-app/var/jb/Applications/
          BIN=stage-app/var/jb/Applications/${APP_NAME}.app/${APP_NAME}
          chmod 755 "$BIN"
          tools/bin/ldid -S"$GITHUB_WORKSPACE/App/entitlements.plist" "$BIN"
          tools/bin/ldid -e "$BIN" | head -5 || true

      # Two loader directories on purpose:
      #   Library/MobileSubstrate/DynamicLibraries -> ElleKit on rootless (Dopamine)
      #   usr/lib/TweakInject                      -> roothide bootstrap
      # Shipping both is what makes one deb work on either device.
      - name: Stage tweak payload
        run: |
          DYLIB=$(cat /tmp/dylib_path)
          rm -rf stage-tweak
          for DIR in \
            stage-tweak/var/jb/Library/MobileSubstrate/DynamicLibraries \
            stage-tweak/var/jb/usr/lib/TweakInject ; do
            mkdir -p "$DIR"
            cp "$DYLIB" "$DIR/${TWEAK_NAME}.dylib"
            cp Tweak/${TWEAK_NAME}.plist "$DIR/"
            chmod 755 "$DIR/${TWEAK_NAME}.dylib"
            chmod 644 "$DIR/${TWEAK_NAME}.plist"
          done
          find stage-tweak -type f | sort
          plutil -p "stage-tweak/var/jb/usr/lib/TweakInject/${TWEAK_NAME}.plist"

      - name: Pack app debs
        run: |
          mkdir -p out
          python3 tools/pack_deb.py --payload stage-app --arch iphoneos-arm64 \
            --version "$VERSION" --maintainer "$PKG_AUTHOR" --author "$PKG_AUTHOR" \
            --out out/${APP_NAME}_${VERSION}_iphoneos-arm64.deb
          python3 tools/pack_deb.py --payload stage-app --arch iphoneos-arm64e \
            --version "$VERSION" --maintainer "$PKG_AUTHOR" --author "$PKG_AUTHOR" \
            --out out/${APP_NAME}_${VERSION}_iphoneos-arm64e.deb

      - name: Pack tweak debs
        run: |
          for ARCH in iphoneos-arm64 iphoneos-arm64e ; do
            python3 tools/pack_deb.py --payload stage-tweak \
              --package com.borderbeam.tweak \
              --name "BorderBeam" \
              --version "$VERSION" \
              --maintainer "$PKG_AUTHOR" \
              --author "$PKG_AUTHOR" \
              --section Tweaks \
              --depends "firmware (>= 15.0)" \
              --description "Animated border beam around the text field you are typing in. CoreAnimation renderer, iOS 15/16 rootless + roothide." \
              --arch "$ARCH" \
              --out out/${TWEAK_NAME}_${VERSION}_${ARCH}.deb
          done

      - name: Verify debs
        run: |
          for f in out/*.deb; do
            echo "=== $f ==="
            ar t "$f"
            rm -rf /tmp/x && mkdir -p /tmp/x && cp "$f" /tmp/x/pkg.deb
            ( cd /tmp/x && ar x pkg.deb && tar xzf data.tar.gz && \
              echo "--- data ---" && \
              find . -not -path "./data.tar.gz" -not -path "./control.tar.gz" \
                -not -path "./debian-binary" -not -path "./pkg.deb" | sort && \
              echo "--- control ---" && tar xzOf control.tar.gz ./control && \
              echo "--- exec ---" && find . -type f -perm -111 | sort )
          done

      - name: Source zip
        run: |
          zip -r out/BorderBeam-src.zip . \
            -x "build/*" "out/*" "stage-*/*" ".git/*" "*.xcodeproj/*" "*.log" "tools/bin/*"

      - name: List artifacts
        run: ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: borderbeam-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
