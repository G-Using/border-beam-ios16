name: Build DEB

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  APP_NAME: BorderBeamDemo
  VERSION: 1.0.0

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project BorderBeamDemo.xcodeproj \
            -scheme BorderBeamDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Verify app bundle
        run: |
          APP=build/Build/Products/Release-iphoneos/${APP_NAME}.app
          test -d "$APP" || { echo "::error::app bundle missing"; tail -80 build.log; exit 1; }
          test -x "$APP/${APP_NAME}" || { echo "::error::executable missing"; ls -la "$APP"; exit 1; }
          echo "--- bundle ---"
          ls -la "$APP"
          echo "--- arch ---"
          lipo -info "$APP/${APP_NAME}"
          echo "--- plist ---"
          plutil -p "$APP/Info.plist"

      - name: Ensure a Metal shader resource ships
        run: |
          # Preferred: Xcode compiled Shaders/BorderBeam.metal into default.metallib.
          # Fallback: ship the .metal source and let BeamMetalView compile it at runtime.
          APP=build/Build/Products/Release-iphoneos/${APP_NAME}.app
          if [ ! -f "$APP/default.metallib" ]; then
            echo "::warning::default.metallib not produced by the build - falling back to runtime shader compilation"
            cp Sources/BorderBeam/Shaders/BorderBeam.metal "$APP/"
          fi
          if [ ! -f "$APP/default.metallib" ] && [ ! -f "$APP/BorderBeam.metal" ]; then
            echo "::error::no shader resource in the bundle, the beam would render nothing"
            exit 1
          fi
          ls -la "$APP" | grep -Ei "metallib|\.metal" || true

      - name: Install ldid
        run: |
          mkdir -p tools/bin
          if [ "$(uname -m)" = "arm64" ]; then A=ldid_macosx_arm64; else A=ldid_macosx_x86_64; fi
          curl -fsSL --retry 3 --retry-delay 3 \
            "https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/$A" \
            -o tools/bin/ldid
          chmod +x tools/bin/ldid
          tools/bin/ldid -h 2>&1 | head -3 || true

      - name: Stage payload and sign
        run: |
          APP=build/Build/Products/Release-iphoneos/${APP_NAME}.app
          BIN_NAME=${APP_NAME}
          rm -rf stage
          mkdir -p stage/var/jb/Applications
          cp -R "$APP" stage/var/jb/Applications/
          BIN=stage/var/jb/Applications/${APP_NAME}.app/${BIN_NAME}
          chmod 755 "$BIN"
          tools/bin/ldid -S"$GITHUB_WORKSPACE/App/entitlements.plist" "$BIN"
          echo "--- entitlements on the binary ---"
          tools/bin/ldid -e "$BIN" || true

      - name: Pack rootless deb
        run: |
          mkdir -p out
          python3 tools/pack_deb.py --payload stage --arch iphoneos-arm64 \
            --out out/${APP_NAME}_${VERSION}_iphoneos-arm64.deb

      - name: Pack roothide deb
        run: |
          python3 tools/pack_deb.py --payload stage --arch iphoneos-arm64e \
            --out out/${APP_NAME}_${VERSION}_iphoneos-arm64e.deb

      - name: Verify debs
        run: |
          for f in out/*.deb; do
            echo "=== $f ==="
            ar t "$f"
            mkdir -p /tmp/x && rm -rf /tmp/x/* && cd /tmp/x && ar x "$OLDPWD/$f"
            tar xzf data.tar.gz
            echo "--- data tree ---"; find . -maxdepth 6 -not -path "./data.tar.gz" -not -path "./control.tar.gz" -not -path "./debian-binary" | sort | head -40
            echo "--- control ---"; tar xzOf control.tar.gz ./control
            echo "--- exec bits ---"; find . -path "*${APP_NAME}.app*" -type f -perm -111 | head
            cd "$OLDPWD"
          done

      - name: Source zip
        run: |
          zip -r out/BorderBeam-iOS15-src.zip . \
            -x "build/*" "out/*" "stage/*" ".git/*" "*.xcodeproj/*" "*.log" "tools/bin/*"

      - name: List artifacts
        run: ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: borderbeam-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
