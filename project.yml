name: BorderBeamDemo

options:
  bundleIdPrefix: com.borderbeam
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    SWIFT_COMPILATION_MODE: wholemodule
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # ---------------------------------------------------------------- demo app
  BorderBeamDemo:
    type: application
    platform: iOS
    sources:
      # Library sources. Shaders are pulled in separately so they land in the
      # Compile Sources phase (Xcode's Metal rule -> default.metallib).
      - path: Sources/BorderBeam
        excludes:
          - "Shaders/**"
      - path: Sources/BorderBeam/Shaders
        buildPhase: sources
      - path: Sources/BorderBeamDemo
      - path: App
        excludes:
          - "Info.plist"
          - "entitlements.plist"
    dependencies:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.borderbeam.demo
        PRODUCT_NAME: BorderBeamDemo
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_EMIT_LOC_STRINGS: NO

  # ------------------------------------------------------- jailbreak tweak
  # Deliberately standalone: the tweak does NOT link the Metal library. It only
  # needs UIKit + QuartzCore, which exist in every injected process. A smaller
  # dependency surface means fewer ways for the dylib to fail silently.
  BorderBeamTweak:
    type: library.dynamic
    platform: iOS
    sources:
      - path: Sources/BorderBeamTweak
    dependencies:
      - sdk: UIKit.framework
    settings:
      base:
        PRODUCT_NAME: BorderBeamTweak
        PRODUCT_BUNDLE_IDENTIFIER: com.borderbeam.tweak
        MACH_O_TYPE: mh_dylib
        SKIP_INSTALL: YES
        LD_DYLIB_INSTALL_NAME: "@rpath/BorderBeamTweak.dylib"
        DYLIB_INSTALL_NAME_BASE: ""
        # Keep every symbol, especially the load-time entry points.
        DEAD_CODE_STRIPPING: NO
        STRIP_INSTALLED_PRODUCT: NO

schemes:
  BorderBeamDemo:
    build:
      targets:
        BorderBeamDemo: all
    run:
      config: Release
    archive:
      config: Release
  BorderBeamTweak:
    build:
      targets:
        BorderBeamTweak: all
    archive:
      config: Release
